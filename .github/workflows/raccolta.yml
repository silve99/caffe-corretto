name: Raccolta notizie

on:
  schedule:
    - cron: "7,37 * * * *"   # ogni 30 minuti (minuti sfalsati per evitare le code delle ore piene)
  workflow_dispatch:
  pull_request:
    paths: ["raccolta/**", ".github/workflows/raccolta.yml"]

permissions:
  contents: write

concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccogli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prendi i dati già raccolti (branch dati)
        run: |
          if git ls-remote --exit-code --heads origin dati >/dev/null; then
            git clone --depth 1 --branch dati "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dati
          else
            mkdir dati && cd dati && git init -q -b dati
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccogli
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python raccolta/raccogli.py --out dati

      - name: Salva nel branch dati
        if: github.event_name != 'pull_request'
        run: |
          cd dati
          git config user.name "caffe-corretto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          # [CF-Pages-Skip] evita che Cloudflare ricostruisca il sito a ogni raccolta
          git commit -qm "[CF-Pages-Skip] raccolta $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q origin dati && break; sleep $((i*5)); git pull -q --rebase origin dati || true; done
